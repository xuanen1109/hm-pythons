name: B2B isolated emulator checks
on:
  push:
    branches: [feature/b2b-firestore-foundation]
    paths:
      - 'b2b/emulator-check.sh'
      - 'b2b/firestore.rules.fragment'
      - '.github/workflows/b2b-emulator.yml'
permissions:
  contents: read
jobs:
  isolated-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run local demo-project emulator only
        run: bash b2b/emulator-check.sh
