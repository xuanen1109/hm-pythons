  const localAdjDefs = [
    { key: 'exposure', label: '曝光' },
    { key: 'contrast', label: '對比' },
    { key: 'saturation', label: '飽和度' },
    { key: 'temp', label: '色溫' },
  ];
  localAdjDefs.forEach(def => {
    const row = document.createElement('div');
    row.className = 'mini-slider';
    row.innerHTML = `
      <div class="head"><span class="lbl">${def.label}</span><span class="val">0</span></div>
      <input type="range" class="slider-input" min="-100" max="100" value="0">
    `;
    localAdjSliders.appendChild(row);
    const input = row.querySelector('input');
    const valEl = row.querySelector('.val');
    input.addEventListener('input', (e) => {
      const v = parseInt(e.target.value);
      if (v === state.localAdj[def.key]) {
        valEl.textContent = v;
        return;
      }
      state.localAdj[def.key] = v;
      valEl.textContent = e.target.value;
      scheduleRender();
    });
    input.addEventListener('change', (e) => {
      const v = parseInt(e.target.value);
      const lastSnap = globalHistory.snapshots[globalHistory.index];
      if (lastSnap && lastSnap.localAdj[def.key] === v) return;
      pushGlobalHistory();
    });
  });

  // Create layer canvas helpers
  function createLayer(w, h, initial) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const cx = c.getContext('2d', { willReadFrequently: true });
    if (initial === 'white') {
      cx.fillStyle = '#ffffff';
      cx.fillRect(0, 0, w, h);
    } else if (initial === 'black') {
      cx.fillStyle = '#000000';
      cx.fillRect(0, 0, w, h);
    } else {
      // transparent: nothing to do
      cx.clearRect(0, 0, w, h);
    }
    return c;
  }

  // Push to history (limit to 20 entries)
  function pushHistory(layer) {
    if (!state.history[layer]) state.history[layer] = [];
    const src = layer === 'mask' ? state.maskCanvas
              : layer === 'local' ? state.localMaskCanvas
              : state.paintCanvas;
    if (!src) return;
    const snapshot = document.createElement('canvas');
    snapshot.width = src.width;
    snapshot.height = src.height;
    snapshot.getContext('2d').drawImage(src, 0, 0);
    state.history[layer].push(snapshot);
    if (state.history[layer].length > 20) state.history[layer].shift();
    updateUndoBtn();
  }

  function undoLayer(layer) {
    const stack = state.history[layer];
    if (!stack || stack.length === 0) return;
    const prev = stack.pop();
    const target = layer === 'mask' ? state.maskCanvas
                 : layer === 'local' ? state.localMaskCanvas
                 : state.paintCanvas;
    const cx = target.getContext('2d');
    cx.clearRect(0, 0, target.width, target.height);
    cx.drawImage(prev, 0, 0);
    updateUndoBtn();
    render();
  }

  function updateUndoBtn() {
    // Now reflects global history availability for the brush panel button
    btnUndo.disabled = globalHistory.index <= 0;
  }

  // Brush mode switching
  brushModeTabs.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      brushModeTabs.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      state.brushMode = b.dataset.mode;

      // UI visibility
      paintColorRow.style.display = state.brushMode === 'paint' ? 'flex' : 'none';
      localAdjPanel.classList.toggle('visible', state.brushMode === 'local');
      maskOverlayRow.style.display = state.brushMode === 'mask' ? 'flex' : 'none';

      canvasWrapper.classList.toggle('brush-active', state.brushMode !== 'off');
      brushCursor.classList.toggle('visible', false);

      // Status
      const statuses = {
        off: '選擇模式開始使用',
        mask: '塗抹=顯示, 橡皮擦=隱藏 · 建議先啟用 AI 去背',
        local: '塗出區域後，上方滑桿只作用於該區',
        paint: '在照片上直接塗色',
      };
      maskStatus.textContent = statuses[state.brushMode];

      updateUndoBtn();
      render();
    });
  });

  // Paint/Erase toggle
  btnPaintMode.addEventListener('click', () => {
    state.brushOp = 'paint';
    btnPaintMode.classList.add('active');
    btnEraseMode.classList.remove('active');
    brushCursor.classList.remove('erase');
  });
  btnEraseMode.addEventListener('click', () => {
    state.brushOp = 'erase';
    btnEraseMode.classList.add('active');
    btnPaintMode.classList.remove('active');
    brushCursor.classList.add('erase');
  });

  // Undo (brush panel) — now wired to global history
  btnUndo.addEventListener('click', () => {
    undoGlobal();
  });

  // Clear current brush layer
  btnClearBrush.addEventListener('click', () => {
    if (state.brushMode === 'off' || !state.originalBitmap) return;
    let target, initial;
    if (state.brushMode === 'mask') { target = state.maskCanvas; initial = 'white'; }
    else if (state.brushMode === 'local') { target = state.localMaskCanvas; initial = 'black'; }
    else { target = state.paintCanvas; initial = 'transparent'; }
    const cx = target.getContext('2d');
    cx.clearRect(0, 0, target.width, target.height);
    if (initial === 'white') { cx.fillStyle = '#fff'; cx.fillRect(0,0,target.width,target.height); }
    else if (initial === 'black') { cx.fillStyle = '#000'; cx.fillRect(0,0,target.width,target.height); }
    render();
    pushGlobalHistory();
  });

  // Mask overlay toggle
  showMaskOverlay.addEventListener('change', (e) => {
    state.showMaskOverlay = e.target.checked;
    render();
  });

  // Paint color
  paintColorInput.addEventListener('input', (e) => {
    state.brush.paintColor = e.target.value;
  });
  quickColors.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      state.brush.paintColor = b.dataset.color;
      paintColorInput.value = b.dataset.color;
    });
  });

  // ============ EYEDROPPER ============
  const btnEyedropper = document.getElementById('btnEyedropper');
  const eyedropCursor = document.getElementById('eyedropCursor');
  const eyedropSwatch = document.getElementById('eyedropSwatch');
  const eyedropHex = document.getElementById('eyedropHex');

  function isEyedropperActive() {
    return state.eyedropActive || state.eyedropTemporary;
  }

  function updateEyedropperUI() {
    const active = isEyedropperActive();
    canvasWrapper.classList.toggle('eyedrop-active', active);
    btnEyedropper.classList.toggle('active', state.eyedropActive);
    if (!active) {
      eyedropCursor.classList.remove('visible');
      brushCursor.classList.remove('visible');
    }
  }

  btnEyedropper.addEventListener('click', () => {
    state.eyedropActive = !state.eyedropActive;
    updateEyedropperUI();
    maskStatus.textContent = state.eyedropActive
      ? '點擊照片任一處以取色'
      : '在照片上直接塗色';
  });

  function sampleColorAt(pt) {
    // Clamp to canvas bounds
    const x = Math.max(0, Math.min(canvas.width - 1, Math.floor(pt.x)));
    const y = Math.max(0, Math.min(canvas.height - 1, Math.floor(pt.y)));
    try {
      const data = ctx.getImageData(x, y, 1, 1).data;
      // If pixel is fully transparent, return null
      if (data[3] === 0) return null;
      const hex = '#' + [data[0], data[1], data[2]]
        .map(v => v.toString(16).padStart(2, '0'))
        .join('').toUpperCase();
      return { hex, r: data[0], g: data[1], b: data[2] };
    } catch (e) {
      return null;
    }
  }

  function updateEyedropCursor(e) {
    if (!isEyedropperActive() || !state.originalBitmap) return;
    const coords = getCanvasCoords(e);
    eyedropCursor.classList.add('visible');
    eyedropCursor.style.left = coords.rectX + 'px';
    eyedropCursor.style.top = coords.rectY + 'px';

    const color = sampleColorAt(coords);
    if (color) {
      eyedropSwatch.style.background = color.hex;
      eyedropHex.textContent = color.hex;
    } else {
      eyedropSwatch.style.background = 'transparent';
      eyedropHex.textContent = '透明';
    }
  }

  function applyEyedrop(e) {
    const coords = getCanvasCoords(e);
    const color = sampleColorAt(coords);
    if (!color) return;
    state.brush.paintColor = color.hex;
    paintColorInput.value = color.hex;
    // Flash the color input to give feedback
    paintColorInput.style.transition = 'transform 0.2s';
    paintColorInput.style.transform = 'scale(1.2)';
    setTimeout(() => { paintColorInput.style.transform = 'scale(1)'; }, 200);
    // Auto-exit eyedropper after pick (if it was button-toggled)
    if (state.eyedropActive) {
      state.eyedropActive = false;
      updateEyedropperUI();
      maskStatus.textContent = `已取色 ${color.hex}`;
    }
  }

  // Alt key = temporary eyedropper (only in paint mode)
  window.addEventListener('keydown', (e) => {
    if ((e.key === 'Alt' || e.altKey) && state.brushMode === 'paint' && !state.eyedropTemporary) {
      state.eyedropTemporary = true;
      updateEyedropperUI();
      e.preventDefault();
    }
    if ((e.key === 'i' || e.key === 'I') && state.brushMode === 'paint') {
      btnEyedropper.click();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'Alt' && state.eyedropTemporary) {
      state.eyedropTemporary = false;
      updateEyedropperUI();
    }
  });
  // Safety: release temporary on blur
  window.addEventListener('blur', () => {
    if (state.eyedropTemporary) {
      state.eyedropTemporary = false;
      updateEyedropperUI();
    }
  });

  // Canvas brush interaction
  // Convert mouse event to canvas pixel coordinates
  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    // Preview zoom (wrapper CSS transform). Cursor elements live INSIDE the
    // wrapper so their style.left/top is in wrapper-local coords — must divide
    // out the zoom from screen-pixel offsets.
    const z = state.previewZoom || 1;
    const screenX = clientX - rect.left;
    const screenY = clientY - rect.top;
    return {
      x: screenX * scaleX,
      y: screenY * scaleY,
      rectX: screenX / z,
      rectY: screenY / z,
      scale: (rect.width / canvas.width) / z,
    };
  }

  function updateBrushCursor(e) {
    if (state.brushMode === 'off' || !state.originalBitmap) {
      brushCursor.classList.remove('visible');
      return;
    }
    const coords = getCanvasCoords(e);
    brushCursor.classList.add('visible');
    brushCursor.style.left = coords.rectX + 'px';
    brushCursor.style.top = coords.rectY + 'px';
    const visualSize = state.brush.size * coords.scale;
    brushCursor.style.width = visualSize + 'px';
    brushCursor.style.height = visualSize + 'px';
  }

  function drawStroke(fromPt, toPt) {
    const mode = state.brushMode;
    if (mode === 'off') return;

    let target, op;
    if (mode === 'mask') {
      target = state.maskCanvas;
      // paint = add white (show), erase = add black (hide)
      op = state.brushOp === 'paint' ? 'white' : 'black';
    } else if (mode === 'local') {
      target = state.localMaskCanvas;
      // paint = white, erase = black
      op = state.brushOp === 'paint' ? 'white' : 'black';
    } else {
      target = state.paintCanvas;
      op = state.brushOp === 'paint' ? state.brush.paintColor : 'erase';
    }

    const cx = target.getContext('2d');
    cx.save();

    const size = state.brush.size;
    const hardness = state.brush.hardness / 100;
    const opacity = state.brush.opacity / 100;

    // Draw along the line from fromPt to toPt
    const dist = Math.hypot(toPt.x - fromPt.x, toPt.y - fromPt.y);
    const step = Math.max(1, size / 8);
    const steps = Math.max(1, Math.ceil(dist / step));

    cx.globalAlpha = opacity;

    if (op === 'erase' && mode === 'paint') {
      cx.globalCompositeOperation = 'destination-out';
      cx.fillStyle = '#000';
    } else {
      cx.globalCompositeOperation = 'source-over';
      if (op === 'white') cx.fillStyle = '#ffffff';
      else if (op === 'black') cx.fillStyle = '#000000';
      else cx.fillStyle = op; // a hex color for paint mode
    }

    for (let i = 0; i <= steps; i++) {
      const t = steps === 0 ? 0 : i / steps;
      const px = fromPt.x + (toPt.x - fromPt.x) * t;
      const py = fromPt.y + (toPt.y - fromPt.y) * t;

      // Radial gradient for soft brush
      const r = size / 2;
      const innerR = r * hardness;
      if (hardness >= 0.99) {
        cx.beginPath();
        cx.arc(px, py, r, 0, Math.PI * 2);
        cx.fill();
      } else {
        const grad = cx.createRadialGradient(px, py, innerR, px, py, r);
        const col = (op === 'erase' && mode === 'paint') ? '#000' :
                    op === 'white' ? '255,255,255' :
                    op === 'black' ? '0,0,0' :
                    hexToRgbStr(op);
        if (op === 'erase' && mode === 'paint') {
          grad.addColorStop(0, 'rgba(0,0,0,1)');
          grad.addColorStop(1, 'rgba(0,0,0,0)');
        } else {
          grad.addColorStop(0, `rgba(${col},1)`);
          grad.addColorStop(1, `rgba(${col},0)`);
        }
        cx.fillStyle = grad;
        cx.beginPath();
        cx.arc(px, py, r, 0, Math.PI * 2);
        cx.fill();
      }
    }

    cx.restore();
  }

  function hexToRgbStr(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `${r},${g},${b}`;
  }

  // Mouse / touch listeners on canvas
  canvas.addEventListener('mousemove', (e) => {
    if (isEyedropperActive()) {
      updateEyedropCursor(e);
      brushCursor.classList.remove('visible');
      return;
    }
    updateBrushCursor(e);
    if (state.isDrawing && state.brushMode !== 'off') {
      const pt = getCanvasCoords(e);
      if (state.lastDrawPoint) {
        drawStroke(state.lastDrawPoint, pt);
      }
      state.lastDrawPoint = pt;
      scheduleRender();
    }
  });

  canvas.addEventListener('mousedown', (e) => {
    if (!state.originalBitmap) return;
    if (isEyedropperActive()) {
      e.preventDefault();
      applyEyedrop(e);
      return;
    }
    if (state.brushMode === 'off') return;
    e.preventDefault();
    state.isDrawing = true;
    const pt = getCanvasCoords(e);
    state.lastDrawPoint = pt;
    drawStroke(pt, pt);
    scheduleRender();
  });

  window.addEventListener('mouseup', () => {
    if (state.isDrawing) {
      state.isDrawing = false;
      state.lastDrawPoint = null;
      render();
      pushGlobalHistory();
    }
  });

  canvas.addEventListener('mouseleave', () => {
    brushCursor.classList.remove('visible');
    eyedropCursor.classList.remove('visible');
  });

  // Touch support
  canvas.addEventListener('touchstart', (e) => {
    if (!state.originalBitmap) return;
    if (isEyedropperActive()) {
      e.preventDefault();
      applyEyedrop(e);
      return;
    }
    if (state.brushMode === 'off') return;
    e.preventDefault();
    state.isDrawing = true;
    const pt = getCanvasCoords(e);
    state.lastDrawPoint = pt;
    drawStroke(pt, pt);
    updateBrushCursor(e);
    scheduleRender();
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    if (isEyedropperActive()) {
      e.preventDefault();
      updateEyedropCursor(e);
      return;
    }
    if (!state.isDrawing) return;
    e.preventDefault();
    updateBrushCursor(e);
    const pt = getCanvasCoords(e);
    if (state.lastDrawPoint) drawStroke(state.lastDrawPoint, pt);
    state.lastDrawPoint = pt;
    scheduleRender();
  }, { passive: false });

  canvas.addEventListener('touchend', () => {
    if (state.isDrawing) {
      state.isDrawing = false;
      state.lastDrawPoint = null;
      render();
      pushGlobalHistory();
    }
  });

  // Keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    // Skip if user is typing in an input
    if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;

    const isMod = e.ctrlKey || e.metaKey;
    if (isMod && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      if (e.shiftKey) {
        redoGlobal();
      } else {
        undoGlobal();
      }
      return;
    }
    if (isMod && (e.key === 'y' || e.key === 'Y')) {
      // Ctrl+Y as alternate redo
      e.preventDefault();
      redoGlobal();
      return;
    }
    // [ ] to resize brush
    if (e.key === '[' || e.key === ']') {
      if (state.brushMode === 'off') return;
      const delta = e.key === '[' ? -10 : 10;
      state.brush.size = Math.max(5, Math.min(300, state.brush.size + delta));
      const sizeInput = brushSlidersContainer.querySelector('input');
      sizeInput.value = state.brush.size;
      sizeInput.parentElement.querySelector('.slider-value').textContent = state.brush.size;
    }
    // E / B to switch erase/paint
    if (e.key === 'e' || e.key === 'E') btnEraseMode.click();
    if (e.key === 'b' || e.key === 'B') btnPaintMode.click();
  });

  // ============ RENDER PIPELINE ============
  let renderScheduled = false;
  function scheduleRender() {
    if (renderScheduled) return;
    renderScheduled = true;
    requestAnimationFrame(() => {
      renderScheduled = false;
      render();
    });
  }

  function render() {
    if (!state.originalBitmap) return;

    const src = state.originalBitmap;
    let srcW = src.width;
    let srcH = src.height;

    // If showing original, just draw original
    if (state.showingOriginal) {
      canvas.width = srcW;
      canvas.height = srcH;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(src, 0, 0);
      return;
    }

    // Determine output dimensions (for crop)
    let outW = srcW, outH = srcH;
    let manualCropX = 0, manualCropY = 0;

    if (state.cropRegion) {
      // Manual crop takes precedence — clamp to source bounds
      const r = state.cropRegion;
      manualCropX = Math.max(0, Math.min(srcW, Math.round(r.x)));
      manualCropY = Math.max(0, Math.min(srcH, Math.round(r.y)));
      outW = Math.max(1, Math.min(srcW - manualCropX, Math.round(r.w)));
      outH = Math.max(1, Math.min(srcH - manualCropY, Math.round(r.h)));
    } else if (state.cropRatio !== 'original') {
      const [rW, rH] = state.cropRatio.split(':').map(Number);
      const targetAspect = rW / rH;
      const srcAspect = srcW / srcH;
      if (srcAspect > targetAspect) {
        outW = Math.floor(srcH * targetAspect);
        outH = srcH;
      } else {
        outW = srcW;
        outH = Math.floor(srcW / targetAspect);
      }
    }

    // Apply padding
    const padPct = state.adjustments.padding / 100;
    const padX = Math.floor(outW * padPct);
    const padY = Math.floor(outH * padPct);
    const finalW = outW + padX * 2;
    const finalH = outH + padY * 2;

    canvas.width = finalW;
    canvas.height = finalH;

    // Paint background
    paintBackground(finalW, finalH);

    // Paint independent frame/padding colour, if enabled and there's a padding ring
    if (state.paddingColorOn && (padX > 0 || padY > 0)) {
      ctx.fillStyle = state.paddingColor;
      // Top ring
      if (padY > 0) ctx.fillRect(0, 0, finalW, padY);
      // Bottom ring
      if (padY > 0) ctx.fillRect(0, finalH - padY, finalW, padY);
      // Left ring
      if (padX > 0) ctx.fillRect(0, padY, padX, finalH - padY * 2);
      // Right ring
      if (padX > 0) ctx.fillRect(finalW - padX, padY, padX, finalH - padY * 2);
    }

    let cropX, cropY;
    if (state.cropRegion) {
      cropX = manualCropX;
      cropY = manualCropY;
    } else {
      cropX = Math.max(0, Math.floor((srcW - outW) / 2));
      cropY = Math.max(0, Math.floor((srcH - outH) / 2));
    }
    const cropW = Math.min(srcW - cropX, outW);
    const cropH = Math.min(srcH - cropY, outH);

    // ============ BUILD SUBJECT LAYER (with mask repair) ============
    // This composite will hold the image with any bg-removal + mask repair applied
    const subjectCanvas = document.createElement('canvas');
    subjectCanvas.width = srcW;
    subjectCanvas.height = srcH;
    const subCtx = subjectCanvas.getContext('2d');

    if (state.bgRemoved && state.transparentBitmap) {
      // Start with transparent bitmap
      subCtx.drawImage(state.transparentBitmap, 0, 0);

      // Apply mask repair: use maskCanvas as alpha modifier
      // White pixel in mask = keep visible (original alpha), black = force hidden
      // But we also want to reveal pixels that AI hid — we need the original image for those
      if (hasMaskEdits()) {
        applyMaskRepair(subCtx, srcW, srcH);
      }
    } else {
      subCtx.drawImage(state.originalBitmap, 0, 0);
    }

    // Draw subject layer onto main canvas (with crop)
    ctx.drawImage(subjectCanvas, cropX, cropY, cropW, cropH, padX, padY, cropW, cropH);

    // Apply global adjustments
    applyAdjustments();

    // Apply LOCAL adjustments (masked)
    if (hasLocalAdjustments()) {
      applyLocalAdjustments(padX, padY, cropX, cropY, cropW, cropH, srcW, srcH);
    }

    // Draw paint layer on top
    if (state.paintCanvas && hasPaintContent()) {
      ctx.drawImage(state.paintCanvas, cropX, cropY, cropW, cropH, padX, padY, cropW, cropH);
    }

    // Mask overlay visualization (red where hidden)
    if (state.showMaskOverlay && state.brushMode === 'mask') {
      drawMaskOverlay(padX, padY, cropX, cropY, cropW, cropH);
    }

    // Watermark
    if (state.watermark.on) drawWatermark();
  }

  function hasMaskEdits() {
    // Always check the actual canvas — render whenever bg is removed and mask exists
    return !!state.maskCanvas;
  }

  function hasLocalAdjustments() {
    // Apply if any local adjustment is non-zero (mask layer is always available)
    const a = state.localAdj;
    return !!(a.exposure || a.contrast || a.saturation || a.temp);
  }

  function hasPaintContent() {
    // Paint layer is always rendered — its transparency handles "no content"
    return !!state.paintCanvas;
  }

  function applyMaskRepair(targetCtx, w, h) {
    // Get current subject image data (has transparent alpha where bg was removed)
    const subjData = targetCtx.getImageData(0, 0, w, h);
    // Get mask data
    const maskCtx = state.maskCanvas.getContext('2d');
    const maskData = maskCtx.getImageData(0, 0, w, h);
    // Get original image data (for pixels we need to "bring back")
    const origCanvas = document.createElement('canvas');
    origCanvas.width = w; origCanvas.height = h;
    origCanvas.getContext('2d').drawImage(state.originalBitmap, 0, 0);
    const origData = origCanvas.getContext('2d').getImageData(0, 0, w, h);

    const s = subjData.data;
    const m = maskData.data;
    const o = origData.data;

    for (let i = 0; i < s.length; i += 4) {
      const maskVal = m[i]; // 0..255, white means show
      const currentAlpha = s[i+3];

      // If mask is pure white (default), keep as-is (AI's decision)
      // If mask is darker than 250, start hiding
      // If mask is near black, force hide
      if (maskVal < 250) {
        // User has modified this area
        if (maskVal < 10) {
          // Force hide
          s[i+3] = 0;
        } else {
          // Partial hide (scale alpha)
          s[i+3] = Math.min(currentAlpha, maskVal);
        }
      } else if (currentAlpha < 255 && maskVal > 250) {
        // User painted white where AI had removed — bring back original
        // Take original pixel, blend based on how white the mask is
        const bringBackAmount = (maskVal - 250) / 5; // 250-255 maps to 0-1
        // If this pixel was fully transparent, restore from original
        if (currentAlpha === 0) {
          s[i] = o[i];
          s[i+1] = o[i+1];
          s[i+2] = o[i+2];
          s[i+3] = 255 * bringBackAmount;
        }
      }
    }
    targetCtx.putImageData(subjData, 0, 0);
  }

  function applyLocalAdjustments(padX, padY, cropX, cropY, cropW, cropH, srcW, srcH) {
    const a = state.localAdj;
    const imgData = ctx.getImageData(padX, padY, cropW, cropH);

    // Get local mask data (scaled to match crop)
    const maskCtx = state.localMaskCanvas.getContext('2d');
    const maskData = maskCtx.getImageData(cropX, cropY, cropW, cropH);

    const d = imgData.data;
    const m = maskData.data;

    const expF = Math.pow(2, a.exposure / 100);
    const contrastF = a.contrast / 100;
    const satF = 1 + a.saturation / 100;
    const tempShift = a.temp * 0.5;

    for (let i = 0; i < d.length; i += 4) {
      const weight = m[i] / 255; // white mask = full apply, black = skip
      if (weight < 0.01) continue;
      if (d[i+3] === 0) continue;

      let r = d[i], g = d[i+1], b = d[i+2];

      // Apply adjustments scaled by weight
      // Exposure
      let nr = r * expF, ng = g * expF, nb = b * expF;

      // Temp
      nr += tempShift;
      nb -= tempShift;

      // Contrast
      if (a.contrast !== 0) {
        nr = ((nr - 128) * (1 + contrastF)) + 128;
        ng = ((ng - 128) * (1 + contrastF)) + 128;
        nb = ((nb - 128) * (1 + contrastF)) + 128;
      }

      // Saturation
      if (a.saturation !== 0) {
        const gray = 0.299 * nr + 0.587 * ng + 0.114 * nb;
        nr = gray + (nr - gray) * satF;
        ng = gray + (ng - gray) * satF;
        nb = gray + (nb - gray) * satF;
      }

      // Blend with original based on weight
      d[i]   = clamp255(r + (nr - r) * weight);
      d[i+1] = clamp255(g + (ng - g) * weight);
      d[i+2] = clamp255(b + (nb - b) * weight);
    }

    ctx.putImageData(imgData, padX, padY);
  }

  function drawMaskOverlay(padX, padY, cropX, cropY, cropW, cropH) {
    // Draw red where mask is black (hidden areas)
    const maskCtx = state.maskCanvas.getContext('2d');
    const maskData = maskCtx.getImageData(cropX, cropY, cropW, cropH);
    const overlayData = ctx.createImageData(cropW, cropH);
    const m = maskData.data;
    const o = overlayData.data;
    for (let i = 0; i < m.length; i += 4) {
      const hidden = 255 - m[i]; // black = hidden = more red
      if (hidden > 10) {
        o[i] = 255;
        o[i+1] = 0;
        o[i+2] = 0;
        o[i+3] = hidden * 0.5;
      }
    }
    // Draw onto main canvas
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = cropW;
    tempCanvas.height = cropH;
    tempCanvas.getContext('2d').putImageData(overlayData, 0, 0);
    ctx.drawImage(tempCanvas, padX, padY);
  }

  function paintBackground(w, h) {
    const bg = state.bgChoice;
    if (bg === 'transparent') {
      ctx.clearRect(0, 0, w, h);
      return;
    }
    if (bg === 'grad-brand') {
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#3B1A10');
      g.addColorStop(1, '#B5733A');
      ctx.fillStyle = g;
    } else if (bg === 'grad-charcoal') {
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#2a2a2a');
      g.addColorStop(1, '#1a1a1a');
      ctx.fillStyle = g;
    } else if (bg === 'custom') {
      ctx.fillStyle = state.customColor;
    } else {
      ctx.fillStyle = bg;
    }
    ctx.fillRect(0, 0, w, h);
  }

  function applyAdjustments() {
    const a = state.adjustments;
    // Only process if any adjustment is non-zero
    const hasAdjustments = Object.values(a).some(v => v !== 0);
    if (!hasAdjustments) return;

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imgData.data;

    // Precalc factors
    const exposureF = Math.pow(2, a.exposure / 100);           // -100..100 -> 0.5..2
    const contrastF = (a.contrast + 100) / 100;                 // 0..2, but we apply differently
    const tempShift = a.temp * 0.5;                              // -50..50 red-blue
    const tintShift = a.tint * 0.3;                              // green-magenta
    const satF = 1 + a.saturation / 100;                         // 0..2
    const vibF = a.vibrance / 100;
    const highF = a.highlights / 100;
    const shadF = a.shadows / 100;
    const whitesF = a.whites / 100;
    const blacksF = a.blacks / 100;
    const clarityF = a.clarity / 200;

    for (let i = 0; i < d.length; i += 4) {
      const alpha = d[i+3];
      if (alpha === 0) continue; // skip transparent pixels

      let r = d[i], g = d[i+1], b = d[i+2];

      // Exposure
      r *= exposureF; g *= exposureF; b *= exposureF;

      // Temperature/Tint
      r += tempShift; b -= tempShift;
      g -= tintShift; r += tintShift * 0.3; b += tintShift * 0.3;

      // Luminance for zone-based adjustments
      let lum = 0.299 * r + 0.587 * g + 0.114 * b;
      const lumN = Math.max(0, Math.min(255, lum)) / 255;

      // Highlights/Shadows/Whites/Blacks — zone-based multipliers
      let zoneAdj = 0;
      // Shadows affect lower tones
      zoneAdj += shadF * Math.max(0, 1 - lumN * 2) * 80;
      // Highlights affect upper tones
      zoneAdj += highF * Math.max(0, (lumN - 0.5) * 2) * 80;
      // Blacks - very dark
      zoneAdj += blacksF * Math.max(0, 1 - lumN * 4) * 60;
      // Whites - very bright
      zoneAdj += whitesF * Math.max(0, (lumN - 0.75) * 4) * 60;

      r += zoneAdj; g += zoneAdj; b += zoneAdj;

      // Contrast
      if (a.contrast !== 0) {
        const cf = a.contrast / 100;
        r = ((r - 128) * (1 + cf)) + 128;
        g = ((g - 128) * (1 + cf)) + 128;
        b = ((b - 128) * (1 + cf)) + 128;
      }

      // Clarity - local contrast approximated via midtone contrast
      if (a.clarity !== 0) {
        const midDist = Math.abs(lumN - 0.5) * 2; // 0 at midtone, 1 at extremes
        const midWeight = 1 - midDist; // 1 at midtone
        r += (r - 128) * clarityF * midWeight;
        g += (g - 128) * clarityF * midWeight;
        b += (b - 128) * clarityF * midWeight;
      }

      // Saturation
      if (a.saturation !== 0) {
        const gray = 0.299 * r + 0.587 * g + 0.114 * b;
        r = gray + (r - gray) * satF;
        g = gray + (g - gray) * satF;
        b = gray + (b - gray) * satF;
      }

      // Vibrance - boost less-saturated colors more
      if (a.vibrance !== 0) {
        const mx = Math.max(r, g, b);
        const mn = Math.min(r, g, b);
        const curSat = (mx - mn) / 255;
        const boost = vibF * (1 - curSat) * 0.8;
        const gray2 = 0.299 * r + 0.587 * g + 0.114 * b;
        r = gray2 + (r - gray2) * (1 + boost);
        g = gray2 + (g - gray2) * (1 + boost);
        b = gray2 + (b - gray2) * (1 + boost);
      }

      d[i]   = clamp255(r);
      d[i+1] = clamp255(g);
      d[i+2] = clamp255(b);
    }

    ctx.putImageData(imgData, 0, 0);

    // Apply sharpness via a simple convolution (cheap version)
    if (a.sharpness > 0) {
      applySharpen(a.sharpness / 100);
    }
  }

  function clamp255(v) {
    return v < 0 ? 0 : v > 255 ? 255 : v;
  }

  function applySharpen(strength) {
    // Lightweight: use drawImage with filter not ideal cross-browser
    // Instead use a tiny unsharp by shifting
    const amount = strength * 0.6;
    const off = document.createElement('canvas');
    off.width = canvas.width;
    off.height = canvas.height;
    const offCtx = off.getContext('2d');
    offCtx.filter = `blur(1px)`;
    offCtx.drawImage(canvas, 0, 0);
    // result = original + (original - blurred) * amount
    const origData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const blurData = offCtx.getImageData(0, 0, canvas.width, canvas.height);
    const o = origData.data, b = blurData.data;
    for (let i = 0; i < o.length; i += 4) {
      if (o[i+3] === 0) continue;
      o[i]   = clamp255(o[i]   + (o[i]   - b[i])   * amount);
      o[i+1] = clamp255(o[i+1] + (o[i+1] - b[i+1]) * amount);
      o[i+2] = clamp255(o[i+2] + (o[i+2] - b[i+2]) * amount);
    }
    ctx.putImageData(origData, 0, 0);
  }

  function drawWatermark() {
    const w = canvas.width;
    const h = canvas.height;
    const fontSize = Math.max(16, Math.floor(w * state.watermark.size / 1000));
    ctx.font = `italic 600 ${fontSize}px "Playfair Display", serif`;
    const text = 'hm.pythons';
    const metrics = ctx.measureText(text);
    const padding = fontSize * 0.7;
    let x, y;
    ctx.textBaseline = 'alphabetic';
    switch (state.watermark.pos) {
      case 'tl': x = padding; y = fontSize + padding * 0.5; break;
      case 'tr': x = w - metrics.width - padding; y = fontSize + padding * 0.5; break;
      case 'bl': x = padding; y = h - padding; break;
      case 'br': default: x = w - metrics.width - padding; y = h - padding;
    }

    // Detect local bg darkness by sampling
    const sample = ctx.getImageData(Math.max(0, x - 5), Math.max(0, y - fontSize), 20, 20);
    let avg = 0;
    for (let i = 0; i < sample.data.length; i += 4) {
      avg += 0.299 * sample.data[i] + 0.587 * sample.data[i+1] + 0.114 * sample.data[i+2];
    }
    avg /= (sample.data.length / 4);
    const isDark = avg < 128;

    const opacity = state.watermark.opacity / 100;
    ctx.fillStyle = isDark
      ? `rgba(245, 239, 230, ${opacity})`
      : `rgba(59, 26, 16, ${opacity})`;
    ctx.fillText(text, x, y);
  }

</script>
